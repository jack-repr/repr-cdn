# Deploy the slide CDN (cdn.repr-fitness.com) with GitHub Actions instead of the legacy Pages builder.
# The legacy builder refused this repo once it passed 1 GB of history (2026-10-19); an Actions deploy only
# uploads the current files (a shallow checkout), so repo history size no longer matters.
name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
